# Offline CI: lint, tests, printed test count, demo, deterministic benchmark check, docs drift,
# brand check and a full-history secret scan. Nothing here talks to a cloud. Actions are pinned to SHAs.
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: pytest -q
      - name: Test count (printed, not swallowed)
        run: python scripts/count_tests.py
      - name: Demo
        run: capplan demo
      - name: Deterministic benchmark numbers match results.json
        run: capplan bench --check results.json
      - name: README and docs numbers match
        run: python scripts/render_docs.py --check
      - name: Brand check (hashed blocklist)
        run: python scripts/check_brands.py

  bpe:
    # Optional real tokenizer: runs the approximation-vs-cl100k test with tiktoken installed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.13", cache: pip }
      - run: pip install -e ".[dev,bpe]"
      - run: pytest -q tests/test_tokens.py -rs

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
